name: Android build

on:
  push:
    branches: [main, release/hmxpdf-2.1.1-build]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: 'Build a signed release candidate artifact (private CI artifact only; no GitHub release)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run JVM unit tests
        run: >
          ./gradlew testPlayDebugUnitTest :pdf-core:test :ocr-core:test
          --rerun-tasks
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Run Android lint
        run: >
          ./gradlew lintPlayDebug
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/playDebug/lintReportPlayDebug/lint-results-playDebug.txt
      - name: Build debug APK
        run: >
          ./gradlew assemblePlayDebug
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: hmx-pdf-debug-apk
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error

  release:
    # Tag pushes are the production path. Manual dispatch is only for a private
    # release-candidate artifact; it never creates a GitHub release. Pushes to the
    # trusted migration branch (release/hmxpdf-2.1.1-build) also produce a signed
    # release-candidate APK: push events run from the reference that a collaborator
    # pushed, so secrets are never exposed to untrusted pull-request code.
    # Configure the 'release' environment with required reviewers and store the
    # signing secrets there rather than at repository scope.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_signed_release) ||
      (github.event_name == 'push' && github.ref_name == 'release/hmxpdf-2.1.1-build')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Validate release signing secrets
        env:
          CLEARPDF_UPLOAD_STORE_BASE64: ${{ secrets.CLEARPDF_UPLOAD_STORE_BASE64 }}
          CLEARPDF_UPLOAD_STORE_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_STORE_PASSWORD }}
          CLEARPDF_UPLOAD_KEY_ALIAS: ${{ secrets.CLEARPDF_UPLOAD_KEY_ALIAS }}
          CLEARPDF_UPLOAD_KEY_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLEARPDF_UPLOAD_STORE_BASE64 CLEARPDF_UPLOAD_STORE_PASSWORD CLEARPDF_UPLOAD_KEY_ALIAS CLEARPDF_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing release signing secret::$name is not configured. Add it to the protected 'release' environment's Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Materialize signing keystore
        env:
          CLEARPDF_UPLOAD_STORE_BASE64: ${{ secrets.CLEARPDF_UPLOAD_STORE_BASE64 }}
          CLEARPDF_UPLOAD_STORE_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_STORE_PASSWORD }}
          CLEARPDF_UPLOAD_KEY_ALIAS: ${{ secrets.CLEARPDF_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          if ! printf '%s' "$CLEARPDF_UPLOAD_STORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error title=Invalid keystore secret::CLEARPDF_UPLOAD_STORE_BASE64 is not valid base64."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error title=Invalid keystore secret::CLEARPDF_UPLOAD_STORE_BASE64 did not decode to a non-empty keystore."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$CLEARPDF_UPLOAD_STORE_PASSWORD" -alias "$CLEARPDF_UPLOAD_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Invalid keystore or credentials::Could not open the keystore with the supplied store password and key alias. Check CLEARPDF_UPLOAD_STORE_BASE64, CLEARPDF_UPLOAD_STORE_PASSWORD, and CLEARPDF_UPLOAD_KEY_ALIAS."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          EXPECTED_SHA256=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$CLEARPDF_UPLOAD_STORE_PASSWORD" -alias "$CLEARPDF_UPLOAD_KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error title=Invalid keystore or credentials::Could not read the signing certificate's SHA-256 fingerprint."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          echo "CLEARPDF_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CLEARPDF_EXPECTED_CERT_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          CLEARPDF_UPLOAD_STORE_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_STORE_PASSWORD }}
          CLEARPDF_UPLOAD_KEY_ALIAS: ${{ secrets.CLEARPDF_UPLOAD_KEY_ALIAS }}
          CLEARPDF_UPLOAD_KEY_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew assemblePlayRelease
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Build signed release bundle
        env:
          CLEARPDF_UPLOAD_STORE_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_STORE_PASSWORD }}
          CLEARPDF_UPLOAD_KEY_ALIAS: ${{ secrets.CLEARPDF_UPLOAD_KEY_ALIAS }}
          CLEARPDF_UPLOAD_KEY_PASSWORD: ${{ secrets.CLEARPDF_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew bundlePlayRelease
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Verify every release APK is signed with the release key
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk/play/release -name '*.apk' -print)
          echo "Found ${#APKS[@]} release APK(s)"
          test "${#APKS[@]}" -gt 0
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in "${APKS[@]}"; do
            if ! CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1); then
              echo "apksigner failed for $APK" >&2
              echo "$CERTS" >&2
              exit 1
            fi
            if ! echo "$CERTS" | grep -q 'certificate DN:'; then
              echo "No signer certificate in apksigner output for $APK" >&2
              echo "$CERTS" >&2
              exit 1
            fi
            if echo "$CERTS" | grep -qi 'CN=Android Debug'; then
              echo "Release APK is debug-signed: $APK" >&2
              exit 1
            fi
            APK_SHA256=$(echo "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ "$APK_SHA256" != "$CLEARPDF_EXPECTED_CERT_SHA256" ]; then
              echo "Release APK signing certificate does not match the configured keystore: $APK" >&2
              echo "APK SHA-256:      $APK_SHA256" >&2
              echo "Keystore SHA-256: $CLEARPDF_EXPECTED_CERT_SHA256" >&2
              exit 1
            fi
          done
      - name: Verify release bundle is signed and not debug-signed
        run: |
          AAB=$(find app/build/outputs/bundle/playRelease -name '*.aab' | head -1)
          test -n "$AAB"
          VERIFY=$(jarsigner -verify -verbose -certs "$AAB" 2>&1) || {
            echo "Release bundle is not validly signed" >&2
            echo "$VERIFY" >&2
            exit 1
          }
          echo "$VERIFY" | grep -q 'jar verified' || {
            echo "Release bundle is not signed" >&2
            exit 1
          }
          if echo "$VERIFY" | grep -qi 'CN=Android Debug'; then
            echo "Release bundle is debug-signed" >&2
            exit 1
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: hmx-pdf-release-apk
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: hmx-pdf-release-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # These dry runs are negative tests, not build attempts. Report assertions below.
          add-job-summary: never
      - name: Release and aggregate tasks must reject missing signing
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          {
            echo '### Release signing guard'
            echo 'Unsigned Gradle dry runs must be rejected before any APK or AAB is built.'
            echo
            echo '| Requested task | Gradle exit code | Guard assertion |'
            echo '| --- | ---: | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          for TASK in :app:assemblePlayRelease :app:assemble :app:build :app:assemblePlay; do
            STATUS=0
            OUTPUT=$(./gradlew "$TASK" --dry-run --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
              -Pkotlin.daemon.jvmargs=-Xmx4g 2>&1) || STATUS=$?
            printf '::group::%s (Gradle exit %s)\n%s\n::endgroup::\n' "$TASK" "$STATUS" "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              RESULT='FAILED: Gradle accepted the unsigned request'
            elif grep -q '^Release signing is not configured\.' <<< "$OUTPUT"; then
              RESULT='EXPECTED BLOCKED: missing signing'
            else
              RESULT='FAILED: Gradle exited without the signing guard diagnostic'
            fi
            printf '| `%s` | `%s` | %s |\n' "$TASK" "$STATUS" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$RESULT" == FAILED:* ]]; then
              printf '::error::%s: %s (Gradle exit %s)\n' "$TASK" "$RESULT" "$STATUS"
              FAILED=1
            else
              printf '%s: %s (Gradle exit %s)\n' "$TASK" "$RESULT" "$STATUS"
            fi
          done

          for DIR in app/build/outputs/apk app/build/outputs/bundle; do
            if [[ -d "$DIR" ]] && [[ -n "$(find "$DIR" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)" ]]; then
              printf '\n**FAILED:** Found an APK or AAB in `%s`.\n' "$DIR" >> "$GITHUB_STEP_SUMMARY"
              printf '::error::Unexpected APK or AAB in %s\n' "$DIR"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 0 ]]; then
            printf '\n**Passed:** All four requests were blocked and no APK or AAB was produced.\n' >> "$GITHUB_STEP_SUMMARY"
            echo 'All four guard assertions passed; no APK or AAB was produced.'
          fi
          exit "$FAILED"
