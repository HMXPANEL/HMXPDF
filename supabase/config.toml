# Public read-only configuration: Android has no Supabase user session.
[functions.config]
verify_jwt = false

# Invite redemption: the invite code is the credential, rate-limited server-side.
[functions.tester-enroll]
verify_jwt = false

# Privileged administration: platform JWT verification plus active allowlist checks.
# MFA is optional; re-enable an AAL2 check in admin-api to require it.
[functions.admin-api]
verify_jwt = true
